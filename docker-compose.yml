
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sezzle-calc-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    networks:
      - calc-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sezzle-calc-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - calc-network

networks:
  calc-network:
    driver: bridge